# Pubblica il Worker (API + app web) su Cloudflare.
# Una tantum: Settings → Secrets and variables → Actions → New repository secret
#   CLOUDFLARE_API_TOKEN   token API con permessi Workers Scripts:Edit, D1:Edit, Workers KV/Assets
#   CLOUDFLARE_ACCOUNT_ID  ID dell'account Cloudflare
name: Deploy Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "worker/**"
      - "web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Migrazioni D1
        run: npm run db:migrate -w worker
      - name: Build e deploy
        run: npm run deploy
